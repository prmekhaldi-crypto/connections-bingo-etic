    // ==========================================
    // SAVE & LOAD SYSTEM (LocalStorage & File)
    // ==========================================
    const SAVE_VERSION = '1.0';
    let currentSaveTab = 'slots';
    let autosaveTimeout = null;

    function getProjectSavePrefix() {
      const safeId = (project.id || project.title || 'hopa_game').replace(/[^a-zA-Z0-9_]/g, '_');
      return 'hopa_save_' + safeId + '_';
    }

    function createSaveDataObject(slotType, slotIndex) {
      const scene = getCurrentScene();
      const allTargets = getAllTargetObjects();
      const foundCount = allTargets.filter(t => foundObjectIds.includes(t.rawObject ? t.rawObject.id : t.id)).length;

      return {
        saveVersion: SAVE_VERSION,
        projectId: project.id || 'default_project',
        projectTitle: project.title || 'Gra HOPA',
        timestamp: Date.now(),
        saveType: slotType || 'manual',
        slotIndex: slotIndex !== undefined ? slotIndex : null,
        summary: {
          sceneName: scene ? scene.title : 'Lokacja',
          sceneId: currentSceneId,
          secondsElapsed: secondsElapsed,
          score: score,
          misclicks: misclicks,
          foundTargetsCount: foundCount,
          totalTargetsCount: allTargets.length,
          inventoryCount: inventoryItemIds.length,
          difficultyPreset: selectedDifficultyPreset
        },
        state: {
          currentSceneId: currentSceneId,
          foundObjectIds: [...foundObjectIds],
          inventoryItemIds: [...inventoryItemIds],
          unlockedHotspotIds: [...unlockedHotspotIds],
          selectedInventoryItemId: selectedInventoryItemId,
          score: score,
          misclicks: misclicks,
          secondsElapsed: secondsElapsed,
          isCompleted: isCompleted,
          difficulty: {
            preset: selectedDifficultyPreset,
            isConfirmed: isDifficultyConfirmed,
            hintCooldownRemaining: hintCooldownRemaining,
            remainingHintCharges: remainingHintCharges
          },
          audio: {
            soundEnabled: soundEnabled,
            musicMuted: musicMuted,
            musicVolume: musicVolume
          }
        }
      };
    }

    function flashAutosaveIndicator() {
      const ind = document.getElementById('autosave-indicator');
      if (!ind) return;
      ind.style.display = 'inline-flex';
      if (autosaveTimeout) clearTimeout(autosaveTimeout);
      autosaveTimeout = setTimeout(() => {
        ind.style.display = 'none';
      }, 2000);
    }

    function performAutosave() {
      if (isCompleted) return;
      try {
        const saveData = createSaveDataObject('auto', 0);
        const key = getProjectSavePrefix() + 'autosave';
        localStorage.setItem(key, JSON.stringify(saveData));
        flashAutosaveIndicator();
      } catch (err) {
        console.warn('Autosave failed:', err);
      }
    }

    function saveToSlot(slotIndex) {
      try {
        const saveData = createSaveDataObject('manual', slotIndex);
        const key = getProjectSavePrefix() + 'slot_' + slotIndex;
        localStorage.setItem(key, JSON.stringify(saveData));
        playCollectSound();
        showToast(t('savedToSlot', { slot: slotIndex }));
        if (document.getElementById('save-load-modal-backdrop')) {
          renderSaveLoadModalContent();
        }
      } catch (err) {
        console.error('Save failed:', err);
        showToast(t('saveError'));
      }
    }

    function getSaveSlot(slotKey) {
      try {
        const raw = localStorage.getItem(slotKey);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function deleteSaveSlot(slotIndex, isAuto) {
      const key = getProjectSavePrefix() + (isAuto ? 'autosave' : ('slot_' + slotIndex));
      if (!confirm(t('startupNewGameConfirm'))) return;
      try {
        localStorage.removeItem(key);
        showToast(t('saveDeleted'));
        if (document.getElementById('save-load-modal-backdrop')) {
          renderSaveLoadModalContent();
        }
      } catch (e) {
        console.error('Delete failed:', e);
      }
    }

    function loadFromSlot(slotIndex, isAuto) {
      const key = getProjectSavePrefix() + (isAuto ? 'autosave' : ('slot_' + slotIndex));
      const data = getSaveSlot(key);
      if (!data) {
        showToast(t('slotEmpty'));
        return;
      }
      applyLoadedSave(data);
      closeSaveLoadModal();
    }

    function applyLoadedSave(saveData) {
      try {
        if (!saveData || !saveData.state) {
          throw new Error('Invalid save format');
        }

        const state = saveData.state;
        currentSceneId = state.currentSceneId || (project.scenes[0] ? project.scenes[0].id : '');
        foundObjectIds = Array.isArray(state.foundObjectIds) ? [...state.foundObjectIds] : [];
        inventoryItemIds = Array.isArray(state.inventoryItemIds) ? [...state.inventoryItemIds] : [];
        unlockedHotspotIds = Array.isArray(state.unlockedHotspotIds) ? [...state.unlockedHotspotIds] : [];
        selectedInventoryItemId = state.selectedInventoryItemId || null;
        score = typeof state.score === 'number' ? state.score : 0;
        misclicks = typeof state.misclicks === 'number' ? state.misclicks : 0;
        secondsElapsed = typeof state.secondsElapsed === 'number' ? state.secondsElapsed : 0;
        isCompleted = Boolean(state.isCompleted);

        if (state.difficulty) {
          selectedDifficultyPreset = state.difficulty.preset || 'standard';
          selectedDifficultyChoice = selectedDifficultyPreset;
          effectiveHintSettings = getEffectiveHintSettings(project.settings || {}, selectedDifficultyPreset);
          isDifficultyConfirmed = state.difficulty.isConfirmed !== undefined ? state.difficulty.isConfirmed : true;
          hintCooldownRemaining = state.difficulty.hintCooldownRemaining || 0;
          remainingHintCharges = state.difficulty.remainingHintCharges !== undefined ? state.difficulty.remainingHintCharges : (effectiveHintSettings.maxCharges || 3);
        }

        if (state.audio) {
          if (state.audio.soundEnabled !== undefined) {
            soundEnabled = state.audio.soundEnabled;
            const btn = document.getElementById('sfx-toggle-btn');
            if (btn) btn.innerText = soundEnabled ? t('sounds') : t('soundsOff');
          }
          if (state.audio.musicMuted !== undefined) musicMuted = state.audio.musicMuted;
          if (state.audio.musicVolume !== undefined) musicVolume = state.audio.musicVolume;
          updateMusicVolume();
        }

        activeHintObjId = null;
        if (hintTimeoutTimer) clearTimeout(hintTimeoutTimer);

        renderScene();
        renderFooter();
        renderHintButton();
        updateTimerDisplay();

        if (timerInterval) clearInterval(timerInterval);
        if (!isCompleted && isDifficultyConfirmed) {
          startTimer();
        }

        playUnlockSound();
        const scene = getCurrentScene();
        showToast(t('loadedSave', { scene: scene ? scene.title : '...' }));
      } catch (err) {
        console.error('Error restoring save state:', err);
        showToast(t('loadError'));
      }
    }

    function exportSaveToFile() {
      try {
        const saveData = createSaveDataObject('file');
        const jsonStr = JSON.stringify(saveData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const safeTitle = (project.title || 'Hopa_Game').replace(/[^a-zA-Z0-9_ -]/g, '_');
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        const fileName = safeTitle + '_Save_' + dateStr + '.hopasave';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        playCollectSound();
        showToast(t('saveFileDownloaded', { file: fileName }));
      } catch (e) {
        console.error('Export save to file failed:', e);
        showToast(t('saveFileExportError'));
      }
    }

    function handleFileImport(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const content = event.target.result;
          const parsed = JSON.parse(content);
          if (parsed.projectId && project.id && parsed.projectId !== project.id) {
            if (!confirm('Ten zapis pochodzi z innego projektu (' + (parsed.projectTitle || 'Inna gra') + '). Czy na pewno chcesz go wczytać?')) {
              return;
            }
          }
          applyLoadedSave(parsed);
          closeSaveLoadModal();
        } catch (err) {
          console.error('Failed to parse save file:', err);
          showToast(t('invalidSaveFile'));
        }
      };
      reader.readAsText(file);
    }

    function openSaveLoadModal(defaultTab) {
      currentSaveTab = defaultTab || 'slots';
      const modalEl = document.getElementById('modal-container');
      if (!modalEl) return;

      modalEl.innerHTML = `
        <div class="modal-backdrop" id="save-load-modal-backdrop" onclick="closeSaveLoadModal()">
          <div class="modal-card save-load-modal" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h2 style="margin:0; font-size:1.4rem; color:#fef08a; display:flex; align-items:center; gap:8px;">
                <span>💾</span> ${t('saveModalTitle')}
              </h2>
              <button onclick="closeSaveLoadModal()" style="background:transparent; border:none; color:#94a3b8; font-size:1.2rem; cursor:pointer; padding:4px 8px;">✕</button>
            </div>

            <div class="save-tab-bar">
              <button class="save-tab-btn ${currentSaveTab === 'slots' ? 'active' : ''}" id="tab-save-slots" onclick="switchSaveTab('slots')">
                ${t('saveTabManual')}
              </button>
              <button class="save-tab-btn ${currentSaveTab === 'file' ? 'active' : ''}" id="tab-save-file" onclick="switchSaveTab('file')">
                ${t('saveTabFile')}
              </button>
            </div>

            <div id="save-modal-body"></div>
          </div>
        </div>
      `;

      renderSaveLoadModalContent();
    }

    function switchSaveTab(tab) {
      currentSaveTab = tab;
      const t1 = document.getElementById('tab-save-slots');
      const t2 = document.getElementById('tab-save-file');
      if (t1) t1.className = 'save-tab-btn' + (tab === 'slots' ? ' active' : '');
      if (t2) t2.className = 'save-tab-btn' + (tab === 'file' ? ' active' : '');
      renderSaveLoadModalContent();
    }

    function renderSaveLoadModalContent() {
      const bodyEl = document.getElementById('save-modal-body');
      if (!bodyEl) return;

      if (currentSaveTab === 'file') {
        bodyEl.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:16px; padding:10px 0;">
            <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:16px; text-align:left;">
              <div style="font-weight:bold; color:#fde68a; font-size:0.95rem; margin-bottom:4px; display:flex; align-items:center; gap:6px;">
                <span>💾</span> ${t('exportSaveTitle')}
              </div>
              <p style="font-size:0.8rem; color:#94a3b8; margin:0 0 12px 0; line-height:1.4;">
                ${t('exportSaveDesc')}
              </p>
              <button class="btn btn-primary" onclick="exportSaveToFile()" style="font-size:0.85rem; padding:8px 18px;">
                ${t('exportSaveBtn')}
              </button>
            </div>

            <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:16px; text-align:left;">
              <div style="font-weight:bold; color:#6ee7b7; font-size:0.95rem; margin-bottom:4px; display:flex; align-items:center; gap:6px;">
                <span>📂</span> ${t('importSaveTitle')}
              </div>
              <p style="font-size:0.8rem; color:#94a3b8; margin:0 0 12px 0; line-height:1.4;">
                ${t('importSaveDesc')}
              </p>
              <label class="btn btn-secondary" style="display:inline-block; font-size:0.85rem; padding:8px 18px; cursor:pointer;">
                ${t('importSaveBtn')}
                <input type="file" accept=".hopasave,.json" onchange="handleFileImport(event)" style="display:none;" />
              </label>
            </div>
          </div>
        `;
        return;
      }

      // 'slots' tab
      let html = '<div class="save-slots-grid">';

      // Slot 0: Autosave
      const autoSave = getSaveSlot(getProjectSavePrefix() + 'autosave');
      html += renderSlotCardHtml(0, autoSave, true);

      // Slots 1, 2, 3: Manual slots
      for (let i = 1; i <= 3; i++) {
        const slotData = getSaveSlot(getProjectSavePrefix() + 'slot_' + i);
        html += renderSlotCardHtml(i, slotData, false);
      }

      html += '</div>';
      bodyEl.innerHTML = html;
    }

    function renderSlotCardHtml(slotIndex, data, isAuto) {
      if (!data) {
        return `
          <div class="save-slot-card empty">
            <div class="save-slot-header">
              <div class="save-slot-title">
                <span>${isAuto ? '⚡' : '💾'}</span>
                <span>${isAuto ? t('startupLastAuto') : ('Slot ' + slotIndex)}</span>
              </div>
              <span style="font-size:0.75rem; color:#64748b;">${t('saveSlotEmpty')}</span>
            </div>
            <div style="padding:14px 0; text-align:center; color:#64748b; font-size:0.8rem; font-style:italic;">
              ${t('saveSlotEmptyDesc')}
            </div>
            <div class="save-slot-actions">
              ${!isAuto ? `
                <button class="btn btn-save" onclick="saveToSlot(${slotIndex})" title="${t('saveBtnHere')}">
                  ${t('saveBtnHere')}
                </button>
              ` : `
                <span style="font-size:0.7rem; color:#64748b;">${t('saveSlotAutoDesc')}</span>
              `}
            </div>
          </div>
        `;
      }

      const sum = data.summary || {};
      const mins = Math.floor((sum.secondsElapsed || 0) / 60);
      const secs = (sum.secondsElapsed || 0) % 60;
      const timeStr = (mins > 0 ? mins + 'm ' : '') + secs + 's';
      const dateStr = new Date(data.timestamp || Date.now()).toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      return `
        <div class="save-slot-card ${isAuto ? 'autosave-card' : ''}">
          <div class="save-slot-header">
            <div class="save-slot-title">
              <span>${isAuto ? '⚡' : '💾'}</span>
              <span>${isAuto ? t('startupLastAuto') : ('Slot ' + slotIndex)}</span>
            </div>
            <div class="save-slot-date">${dateStr}</div>
          </div>

          <div class="save-slot-summary">
            <div>📍 ${t('locationLabel')} <strong>${escapeHtml(sum.sceneName || 'Scena')}</strong></div>
            <div>🎯 ${t('targetsLabel')} <strong>${sum.foundTargetsCount || 0} / ${sum.totalTargetsCount || 0}</strong> &bull; ${t('inventoryLabel')} <strong>${sum.inventoryCount || 0}</strong></div>
            <div>⭐ ${t('scoreLabel')} <strong>${sum.score || 0} ${t('score')}</strong> &bull; ⏱️ ${t('timeLabel')} <strong>${timeStr}</strong></div>
          </div>

          <div class="save-slot-actions">
            <button class="btn btn-load" onclick="loadFromSlot(${slotIndex}, ${isAuto})" title="${t('loadBtn')}">
              ${t('loadBtn')}
            </button>
            ${!isAuto ? `
              <button class="btn btn-save" onclick="saveToSlot(${slotIndex})" title="${t('saveBtnOverwrite')}">
                ${t('saveBtnOverwrite')}
              </button>
            ` : ''}
            <button class="btn btn-delete" onclick="deleteSaveSlot(${slotIndex}, ${isAuto})" title="🗑️">
              🗑️
            </button>
          </div>
        </div>
      `;
    }

    function closeSaveLoadModal() {
      const modalEl = document.getElementById('modal-container');
      if (modalEl) modalEl.innerHTML = '';
      if (!isDifficultyConfirmed && !timerInterval) {
        const latestInfo = getLatestSaveInfo();
        if (latestInfo) {
          showStartupResumeModal(latestInfo);
        } else {
          startNewGameFlow(false);
        }
      }
    }

    // Keyboard Shortcuts (Ctrl+S / Cmd+S to save, F6 to open modal, Escape to close)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveToSlot(1);
      }
      if (e.key === 'F6') {
        e.preventDefault();
        openSaveLoadModal();
      }
      if (e.key === 'Escape') {
        const modalEl = document.getElementById('modal-container');
        if (modalEl && modalEl.innerHTML) {
          modalEl.innerHTML = '';
        }
      }
    });

    let toastTimeout = null;

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      if (toastTimeout) {
        clearTimeout(toastTimeout);
        toastTimeout = null;
      }
      container.innerHTML = '<div class="toast">' + escapeHtml(msg) + '</div>';
      toastTimeout = setTimeout(() => {
        container.innerHTML = '';
        toastTimeout = null;
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('resize', updateFrameDimensions);
    window.onload = initGame;
  </script>
  <script type="module" src="/src/report.ts"></script>
</body>
</html>
